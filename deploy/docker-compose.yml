# Local full stack: docker compose -f deploy/docker-compose.yml --env-file .env up --build
services:
  db:
    image: timescale/timescaledb-ha:pg16
    environment: { POSTGRES_USER: gb, POSTGRES_PASSWORD: gb, POSTGRES_DB: globalblocs }
    volumes: [ "pgdata:/home/postgres/pgdata", "../data_pipelines/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro" ]
    ports: [ "5432:5432" ]
  redis:
    image: redis:7-alpine
  api:
    build: { context: .., dockerfile: deploy/Dockerfile.backend }
    env_file: ../.env
    environment: { DATABASE_URL: "postgresql://gb:gb@db:5432/globalblocs", REDIS_URL: "redis://redis:6379/0", AUDIT_LOG: /srv/data/audit.jsonl }
    volumes: [ "auditdata:/srv/data" ]
    depends_on: [ db, redis ]
    ports: [ "8000:8000" ]
  web:
    build: { context: .., dockerfile: deploy/Dockerfile.frontend, args: { NEXT_PUBLIC_API_URL: "http://localhost:8000" } }
    ports: [ "3000:80" ]
volumes: { pgdata: {}, auditdata: {} }
