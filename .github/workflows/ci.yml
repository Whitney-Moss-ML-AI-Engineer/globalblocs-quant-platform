name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt pytest
      - run: pytest -q
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: cd frontend && npm ci && npm run build
  desktop:
    needs: [python, frontend]
    if: github.event_name != 'pull_request'
    strategy: { fail-fast: false, matrix: { os: [windows-latest, macos-latest, ubuntu-latest] } }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: cd frontend && npm ci && npm run build
      - run: cd desktop && npm install
      - run: cd desktop && npx electron-builder --publish never
        env: { CSC_IDENTITY_AUTO_DISCOVERY: "false" }
      - uses: actions/upload-artifact@v4
        with: { name: installer-${{ matrix.os }}, path: "desktop/dist/*.*", retention-days: 30 }
