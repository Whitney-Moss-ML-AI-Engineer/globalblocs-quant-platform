name: CI
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: cd frontend && npm ci && npm run build

  desktop:
    needs: [python, frontend]
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: cd frontend && npm ci && npm run build
      - run: cd desktop && npm install
      - run: cd desktop && npx electron-builder --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*.dmg
            desktop/dist/*.AppImage
            desktop/dist/*.deb
          retention-days: 30

  android:
    needs: [python, frontend]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: cd frontend && npm ci && npm run build
      - run: cd mobile && npm ci && npm run android:apk
      - name: Name the APK
        run: |
          V=$(node -p "require('./mobile/package.json').version")
          mkdir -p mobile-out
          cp mobile/android/app/build/outputs/apk/debug/app-debug.apk "mobile-out/GlobalBLOCS-Quant-$V-android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: installer-android
          path: mobile-out/*.apk
          retention-days: 30

  ios:
    needs: [python, frontend]
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: cd frontend && npm ci && npm run build
      - run: cd mobile && npm ci && npm run ios:init
      - name: Compile for the iPhone simulator (verifies the project; no signing)
        run: |
          set -o pipefail
          cd mobile/ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build | tail -20
      - name: Package the Xcode project for signing
        run: |
          V=$(node -p "require('./mobile/package.json').version")
          mkdir -p mobile-out
          cp mobile/IOS-SETUP.txt mobile-out/ 2>/dev/null || true
          zip -qr "mobile-out/GlobalBLOCS-Quant-$V-iOS-Xcode-project.zip" mobile frontend/out \
            -x "mobile/node_modules/*" "mobile/android/*" "mobile/ios/App/Pods/*" "mobile/ios/App/build/*" "*/DerivedData/*"
      - uses: actions/upload-artifact@v4
        with:
          name: installer-ios
          path: mobile-out/*.zip
          retention-days: 30

  release:
    needs: [desktop, android, ios]
    if: always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.desktop.result != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - name: Publish GitHub Release with installers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=v$(node -p "require('./desktop/package.json').version")
          ls -la installers
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" installers/* --clobber
          else
            gh release create "$VERSION" installers/* --target "$GITHUB_SHA" --title "GlobalBLOCS Quant $VERSION" \
              --notes "Desktop installers and phone app. Android: install GlobalBLOCS-Quant-*-android.apk (allow installs from this source). iPhone: open the iOS Xcode project zip in Xcode, set your Apple Developer team, and run on your phone. Windows: run GlobalBLOCS-Quant-Setup-*.exe (unsigned: SmartScreen > More info > Run anyway). macOS: open the .dmg (unsigned: right-click > Open). Linux: AppImage or .deb. Requires Python 3.10+; the Setup Wizard runs on first launch."
          fi
