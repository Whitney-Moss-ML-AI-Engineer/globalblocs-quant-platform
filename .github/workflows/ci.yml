name: CI
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: cd frontend && npm ci && npm run build

  desktop:
    needs: [python, frontend]
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: cd frontend && npm ci && npm run build
      - run: cd desktop && npm install
      - run: cd desktop && npx electron-builder --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*.dmg
            desktop/dist/*.AppImage
            desktop/dist/*.deb
          retention-days: 30

  release:
    needs: [desktop]
    if: always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.desktop.result != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - name: Publish GitHub Release with installers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=v$(node -p "require('./desktop/package.json').version")
          ls -la installers
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" installers/* --clobber
          else
            gh release create "$VERSION" installers/* --target "$GITHUB_SHA" --title "GlobalBLOCS Quant $VERSION" \
              --notes "Desktop installers. Windows: run GlobalBLOCS-Quant-Setup-*.exe (unsigned: SmartScreen > More info > Run anyway). macOS: open the .dmg (unsigned: right-click > Open). Linux: AppImage or .deb. Requires Python 3.10+; the Setup Wizard runs on first launch."
          fi
